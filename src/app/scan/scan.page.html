<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>
      Scan
    </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <h2>Scan Barcode</h2>
  <div class="scan-div barcode-scanner-active">
    <button class="submit start-scan" ion-button (click)="scan()"><p><ion-icon name="barcode"></ion-icon><br/>Scan</p></button>
  </div>
</ion-content>
