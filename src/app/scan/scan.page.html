<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>
      Scan
    </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" [className]="activateScanner ? 'barcode-scanner-active' : 'barcode-scanner-inactive'">
  <h2 *ngIf="headerDisplayed">Scan Barcode</h2>
  <div class="scan-div">
    <button *ngIf="buttonDisplayed" class="submit start-scan" ion-button (click)="scan()"><p><ion-icon name="barcode"></ion-icon><br/>Scan</p></button>
  </div>
</ion-content>
