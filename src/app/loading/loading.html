<ion-content padding class="loading-content">
  <ion-grid style="height: 100%">
    <ion-row justify-content-center align-items-end style="height: 50%">
      <ion-spinner color="secondary" style="height: 10em"></ion-spinner>
    </ion-row>
    <ion-row justify-content-center align-items-start style="height: 50%">
      <h6>{{loadingMessage}}<ion-spinner name="dots" color="light" style="top: 1em"></ion-spinner></h6>
    </ion-row>
  </ion-grid>
</ion-content>
