<ion-header>
  <ion-toolbar color="secondary">
    <ion-title>
      <img class="wuzinit-logo" src="assets/imgs/logo.png" alt="W">
      Receipt
    </ion-title>
    <ion-buttons end>
      <ion-button (click)="closeModal()"><ion-icon name="close"></ion-icon></ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content padding class="body-content">
  <ion-list>
    <ion-list-header>
      Premium Features
    </ion-list-header>
    <ion-card *ngFor="let feature of premiumFeaturePurchaseConfirmations">
      <p>Feature: {{feature.featureTitle}}</p>
      <p>Transaction Id: {{feature.transactionId}}</p>
    </ion-card>
  </ion-list>
  <ion-list>
    <ion-list-header>
      Past In App Purchases
    </ion-list-header>
    <ion-card *ngFor="let confirmation of inAppPurchaseConfirmations">
      <p>Product: {{confirmation.productTitle}}</p>
      <p>Transaction Id: {{confirmation.transactionId}}</p>
    </ion-card>
  </ion-list>
  <ion-buttons>
    <ion-button (click)="closeModal()"><p>Close</p><ion-icon name="thumbs-up"></ion-icon></ion-button>
  </ion-buttons>
</ion-content>
