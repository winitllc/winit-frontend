<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button></ion-back-button>
    </ion-buttons>
    <ion-title>results</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-list>
    <ion-item *ngFor="let product of products">
      <ion-card (click)="select(product)" [ngClass]="{'product-plank': true}">
        <ion-row>
          <img class="product-thumbnail" [src]="product.image"/>
          <div class="product-info">
            <h3 class="result-title">{{product.title}}</h3>
          </div>
        </ion-row>
      </ion-card>
    </ion-item>
  </ion-list>

  <!-- <ion-infinite-scroll (ionInfinite)="scrollEvent($event)" threshold="25%">
    <ion-infinite-scroll-content></ion-infinite-scroll-content>
  </ion-infinite-scroll> -->
</ion-content>
