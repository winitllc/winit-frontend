<ion-header>
  <ion-toolbar color="primary">
    <ion-title class="ion-text-center">Results</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <div *ngIf="!noResults">
    <ion-grid>
      <ion-row *ngFor="let product of productResults">
        <ion-col>
          <img src="{{product.image_thumb_url}}"/>
        </ion-col>
        <ion-col size="10">
          <ion-card>
            <ion-card-title>{{product.product_name}}</ion-card-title>
            <ion-card-subtitle>{{product.ingredients_text_en}}</ion-card-subtitle>
          </ion-card>
        </ion-col>
      </ion-row>
    </ion-grid>
  </div>
  <div *ngIf="noResults">
    <ion-grid>
      <ion-row class="ion-justify-content-center">
        <ion-col>
          <div class="productImage">
            <img src="assets/imgs/noProduct.png">
          </div>
        </ion-col>
      </ion-row>
    </ion-grid>
  </div>
</ion-content>
