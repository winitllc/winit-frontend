<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>
      Scan
    </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <h2><img class="header-icon" src="assets/icon/favicon.png">Scan Barcode</h2>
  <div class="scan-div">
    <button class="submit start-scan" ion-button (click)="scan()">
      <ion-icon name="barcode"></ion-icon>
    </button>
  </div>
</ion-content>
